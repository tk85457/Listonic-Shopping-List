name: grocerylist
description: "Shopping list - Grocery Planner - AI-Powered Intelligent Shopping Assistant"
publish_to: "none"
version: 1.0.7+8

# Update package name for Android
package_name: com.list.listonic

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  equatable: ^2.0.5
  get: ^4.6.6
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Database & Storage
  shared_preferences: ^2.5.4
  path_provider: ^2.1.2

  # Image & Media
  image_picker: ^1.0.7

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Networking
  flutter_dotenv: ^6.0.0
  http: ^1.6.0

  # UI & Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  uuid: ^4.3.3

  # Permissions & Auth
  permission_handler: ^12.0.1
  local_auth: ^3.0.1

  # Splash Screen (runtime plugin - must be in dependencies)
  flutter_native_splash: ^2.4.0
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - .env

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  image_path: "assets/images/app_icon_source.png"
  image_path_android: "assets/images/app_icon_source.png"
  image_path_ios: "assets/images/app_icon_source.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/images/app_icon_source.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#7C4DFF"
  image: "assets/images/app_icon_source.png"
  android: true
  ios: true
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  android_12:
    image: "assets/images/app_icon_source.png"
    color: "#7C4DFF"

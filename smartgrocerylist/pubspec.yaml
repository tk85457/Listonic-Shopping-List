name: smartgrocerylist
description: "Smart Grocery List - AI-Powered Intelligent Shopping Assistant"
publish_to: "none"
version: 1.0.0+1

# Update package name for Android
package_name: com.smartgrocery.smartgrocerylis

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  equatable: ^2.0.5

  # Database & Storage
  shared_preferences: ^2.5.4

  # Image Picker
  image_picker: ^1.0.7
  mobile_scanner: ^4.0.0

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Authentication
  supabase_flutter: ^2.6.0

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  uuid: ^4.3.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0

  # Notifications
  flutter_local_notifications: 16.1.0

  # Permissions
  permission_handler: ^12.0.1
  pinput: ^6.0.1
  get: ^4.7.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  google_sign_in: ^6.2.1
  flutter_dotenv: ^6.0.0
  webview_flutter: ^4.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - .env


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
